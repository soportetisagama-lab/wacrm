name: Build and Push Docker Image (Sagama Maxi)
on:
  push:
    branches: [xlr9-maxi]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/soportetisagama-lab/wacrm:xlr9-maxi
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.MAXI_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.MAXI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.MAXI_NEXT_PUBLIC_SITE_URL }}
      # Despliega en EasyPanel solo después de que la imagen ya está en GHCR.
      # Si el secreto aún no existe, se salta sin fallar el build.
      - name: Deploy en EasyPanel
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_MAXI }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "EASYPANEL_DEPLOY_MAXI no está configurado; se omite el deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_URL" > /dev/null
          echo "Deploy lanzado en EasyPanel."
